name: Tests

# לא חוסם את הסריקה (scan.yml נפרד) - כשל כאן הוא רק סימן אדום + מייל מ-GitHub,
# כדי שבדיקה שבורה לא תעצור התראות אמיתיות.
on:
  push:
    branches: [master]
    paths: ["src/**", "tests/**", "data/**", "run_*.py", ".github/workflows/tests.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
