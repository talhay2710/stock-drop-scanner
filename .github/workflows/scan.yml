name: Stock Scan

on:
  # ה-cron המובנה של GitHub לא אמין ב-5 דקות בפועל (הוא "best effort" ומדחה
  # ריצות תכופות ב-repos לא-פעילים - נמדד בפועל פערים של שעה-שעתיים במקום 5
  # דקות). נשאר כגיבוי איטי, אבל הטריגר האמיתי הוא workflow_dispatch שמופעל
  # מ-שירות cron חיצוני (cron-job.org) שקורא ל-API הזה כל 5 דקות בפועל.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# מונע שתי ריצות מתנגשות שכותבות ל-alerts.db בו-זמנית (למשל אם ריצה קודמת
# עוד לא הסתיימה כשהבאה מתחילה).
concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scan_once.py

      # שלושת אלה היו רק על Task Scheduler מקומי (תלוי שהמחשב דלוק) - עכשיו
      # רצים גם כאן, על אותו טריגר האמין שכבר קיים לסורק. כל סקריפט שומר על
      # עצמו: מדלג בשקט אם לא בחלון הזמן שלו או שכבר נשלח היום (src/schedule_guard.py),
      # אז אין בעיה שהם "רצים" בכל סריקה - רק אחת מהן בפועל תעשה משהו ביום נתון.
      # continue-on-error - כשל בסיכום לא אמור להפיל את כל ריצת הסריקה.
      - name: Run morning summary (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_morning_summary.py

      - name: Run daily summary (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_summary.py

      - name: Run weekly report (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_weekly_report.py

      # alerts.db הוא מקור האמת המשותף עם הדשבורד ב-Streamlit Cloud (שמתעדכן
      # אוטומטית בכל push). commit רק אם יש שינוי אמיתי - לא בכל ריצה - כדי
      # שהיסטוריית ה-git לא תתנפח מ-288 commits ריקים ביום.
      #
      # push עם retry+rebase: גילינו בפועל (20.8.2026) ש-push רגיל נכשל
      # (exit 128) כל פעם שמישהו דוחף commit אחר (למשל מהמחשב המקומי) בדיוק
      # תוך כדי שהריצה הזו באמצע - וזה קרה הרבה יותר ממה שחשבנו. התוצאה
      # הייתה חמורה בשקט: הודעת טלגרם כבר נשלחה, אבל הסימון "כבר נשלח היום"
      # (summary_log) לא הגיע לענן, אז הריצה הבאה לא ידעה שכבר נשלח והתריעה/
      # שלחה שוב. pull --rebase + ניסיון חוזר סוגר את הפער.
      - name: Commit alerts.db if changed
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- alerts.db; then
            git add alerts.db
            git commit -m "Update alerts.db [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $i) - pulling and retrying..."
              git pull --rebase --autostash
            done
            echo "Push still failing after 5 attempts - giving up for this run."
            exit 1
          else
            echo "No change in alerts.db, skipping commit."
          fi
