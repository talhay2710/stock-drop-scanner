name: Stock Scan

on:
  schedule:
    # כל 5 דקות - run_scan מדלג פנימית על מדדים שהשוק שלהם סגור, אז אין
    # בעיה שזה ירוץ גם מחוץ לשעות המסחר (רק כמה ריצות מבוזבזות, בלי נזק).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# מונע שתי ריצות מתנגשות שכותבות ל-alerts.db בו-זמנית (למשל אם ריצה קודמת
# עוד לא הסתיימה כשהבאה מתחילה).
concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scan_once.py

      # alerts.db הוא מקור האמת המשותף עם הדשבורד ב-Streamlit Cloud (שמתעדכן
      # אוטומטית בכל push). commit רק אם יש שינוי אמיתי - לא בכל ריצה - כדי
      # שהיסטוריית ה-git לא תתנפח מ-288 commits ריקים ביום.
      - name: Commit alerts.db if changed
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- alerts.db; then
            git add alerts.db
            git commit -m "Update alerts.db [skip ci]"
            git push
          else
            echo "No change in alerts.db, skipping commit."
          fi
