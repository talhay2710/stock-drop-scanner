name: Stock Scan

on:
  # הוסר ה-cron המובנה של GitHub (24.8.2026) - הוא היה אמור לשמש רק כגיבוי
  # איטי, אבל בפועל גרם לריצות כפולות שרצות צמוד לטריגר החיצוני (cron-job.org
  # קורא ל-workflow_dispatch כל 5 דקות בצורה אמינה) - שתי ריצות קרובות מדי
  # אחת לשנייה יכולות לקרוא stop_alert_active לפני ששתיהן הספיקו לעדכן אותו,
  # מה שגרם להתראות טלגרם כפולות (למשל 3 התראות רצופות על טאואר). הסיכון
  # מהסרת הגיבוי מכוסה כבר ע"י גלאי "שקט בסריקה" (scan_heartbeat_gap_alert_minutes).
  workflow_dispatch: {}

# מונע שתי ריצות מתנגשות שכותבות ל-alerts.db בו-זמנית (למשל אם ריצה קודמת
# עוד לא הסתיימה כשהבאה מתחילה).
concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scan_once.py

      # שלושת אלה היו רק על Task Scheduler מקומי (תלוי שהמחשב דלוק) - עכשיו
      # רצים גם כאן, על אותו טריגר האמין שכבר קיים לסורק. כל סקריפט שומר על
      # עצמו: מדלג בשקט אם לא בחלון הזמן שלו או שכבר נשלח היום (src/schedule_guard.py),
      # אז אין בעיה שהם "רצים" בכל סריקה - רק אחת מהן בפועל תעשה משהו ביום נתון.
      # continue-on-error - כשל בסיכום לא אמור להפיל את כל ריצת הסריקה.
      - name: Run morning summary (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_morning_summary.py

      - name: Run daily summary (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_summary.py

      - name: Run weekly report (if due)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_weekly_report.py

      # alerts.db הוא מקור האמת המשותף עם הדשבורד ב-Streamlit Cloud (שמתעדכן
      # אוטומטית בכל push). commit רק אם יש שינוי אמיתי - לא בכל ריצה - כדי
      # שהיסטוריית ה-git לא תתנפח מ-288 commits ריקים ביום.
      #
      # למה לא git pull --rebase: alerts.db הוא קובץ בינארי (SQLite) - git לא
      # יודע למזג שינויים בינאריים, אז ברגע ששני commits נוגעים בו, rebase
      # פשוט נתקע ("both modified", לא ניתן לפתרון אוטומטי) והפעולה נכשלת
      # בשקט. זה מה שקרה בפועל (20.8.2026): ה-retry שהוספנו קודם דיווח "עובד"
      # אבל בפועל לא הצליח לדחוף אף פעם במשך שעות, וכל ה-state ("כבר התרענו
      # על זה") אבד בכל ריצה - זו הסיבה שהתראות "מתקרבת לסטופ" חזרו על עצמן
      # שוב ושוב על אותה מניה. הפתרון: בלי merge/rebase בכלל - בכל כשל push,
      # מסתנכרנים מחדש עם origin ומחילים את הגרסה שלנו של alerts.db מעליו
      # מחדש (אנחנו תמיד "מנצחים" בהתנגשות על הקובץ הזה - עדיף לאבד כמה
      # שניות של שינוי מריצה אחרת מאשר לתקוע את כל הסנכרון).
      - name: Commit alerts.db if changed
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- alerts.db; then
            cp alerts.db /tmp/alerts_ours.db
            git add alerts.db
            git commit -m "Update alerts.db [skip ci]"
            success=0
            for i in 1 2 3 4 5; do
              if git push; then
                success=1
                break
              fi
              echo "Push rejected (attempt $i) - resyncing with origin and retrying..."
              git fetch origin
              git reset --hard origin/master
              cp /tmp/alerts_ours.db alerts.db
              git add alerts.db
              git commit -m "Update alerts.db [skip ci]"
            done
            if [ "$success" -ne 1 ]; then
              echo "Push still failing after 5 attempts - giving up for this run."
              exit 1
            fi
          else
            echo "No change in alerts.db, skipping commit."
          fi
