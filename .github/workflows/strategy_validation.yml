name: Strategy Validation

# אימות עתידי עיוור שבועי של ניקוד האסטרטגיה (validate_strategy.py): הדוח מופיע בסיכום הריצה (Summary).
# לא חוסם דבר ולא שולח הודעות - רק דוח לקריאה. הניקוד המוקפא נבדק על התראות מ-FREEZE_DATE ואילך.
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run blind validation
        run: python validate_strategy.py | tee -a "$GITHUB_STEP_SUMMARY"
