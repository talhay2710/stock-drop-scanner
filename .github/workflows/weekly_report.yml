name: Weekly Report

on:
  # מופעל אך ורק ע"י cron-job.org (job ייעודי, פעם בשבוע ~15:00 שעון ישראל) -
  # ר' daily_summary.yml להסבר המלא על למה אין schedule: מובנה כאן.
  workflow_dispatch: {}

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_weekly_report.py

      # ר' scan.yml להסבר המלא - אין merge/rebase על alerts.db (בינארי, לא
      # ניתן למיזוג), במקום זאת מסתנכרנים מחדש עם origin ומחילים את הגרסה
      # שלנו מעליו בכל ניסיון.
      # הלוגיקה המלאה (legacy = כמו קודם, split = pull --rebase רגיל) ב-ci_commit_alerts_db.sh, משותפת לכל ה-workflows.
      - name: Commit alerts.db if changed
        run: bash ci_commit_alerts_db.sh
