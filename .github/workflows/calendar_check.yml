name: TASE Calendar Check

# בדיקה שבועית שלוח החגים (data/tase_closed_days.csv) תואם את נתוני השוק בפועל.
# כשל = מייל מ-GitHub => לעדכן את הקובץ.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python check_tase_calendar.py
