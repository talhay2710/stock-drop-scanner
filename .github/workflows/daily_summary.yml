name: Daily Summary

on:
  # בפועל לא רץ אוטומטית משום מקום - scan.yml כבר מריץ run_daily_summary.py
  # בכל סריקה (כל 5 דק'), והסקריפט עצמו מדלג בשקט חוץ מבחלון הזמן שלו
  # (~18:00 שעון ישראל, ר' src/schedule_guard.py). הפעלה ידנית של הקובץ הזה
  # מה-Actions UI עדיין תדלג אם זה מחוץ לאותו חלון זמן - זה לא "שלח עכשיו
  # בכפייה", רק מאפשר להריץ את אותה בדיקה שוב בלי לחכות לטריגר הבא של scan.yml.
  workflow_dispatch: {}

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_summary.py

      # ר' scan.yml להסבר המלא - אין merge/rebase על alerts.db (בינארי, לא
      # ניתן למיזוג), במקום זאת מסתנכרנים מחדש עם origin ומחילים את הגרסה
      # שלנו מעליו בכל ניסיון.
      - name: Commit alerts.db if changed
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- alerts.db; then
            cp alerts.db /tmp/alerts_ours.db
            git add alerts.db
            git commit -m "Update alerts.db [skip ci]"
            success=0
            for i in 1 2 3 4 5; do
              if git push; then
                success=1
                break
              fi
              echo "Push rejected (attempt $i) - resyncing with origin and retrying..."
              git fetch origin
              git reset --hard origin/master
              cp /tmp/alerts_ours.db alerts.db
              git add alerts.db
              git commit -m "Update alerts.db [skip ci]"
            done
            if [ "$success" -ne 1 ]; then
              echo "Push still failing after 5 attempts - giving up for this run."
              exit 1
            fi
          else
            echo "No change in alerts.db, skipping commit."
          fi
